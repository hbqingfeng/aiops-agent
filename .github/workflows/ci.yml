name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        # 测试为纯逻辑测试（不调用 LLM / 不连 K8s），无需安装 chromadb、sentence-transformers 等重型模型库
        # 直接用 requirements.txt 安装（含锁版本 + pytest），保证本地与 CI 依赖一致
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
