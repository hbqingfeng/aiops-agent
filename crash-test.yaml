apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  namespace: default
spec:
  containers:
  - name: main
    image: registry.k8s.io/etcd:3.6.8-0
    # 故意传一个不存在的启动参数：etcd 解析参数阶段就报错并以非 0 退出
    # -> 容器崩溃 -> K8s 不断重启 -> CrashLoopBackOff
    command: ["/usr/local/bin/etcd", "--this-flag-does-not-exist"]
